name: APK Android
on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Colocar o app dentro do APK
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/
      - name: Gerar APK
        working-directory: android
        env: { VCODE: '${{ github.run_number }}' }
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publicar no branch apk
        run: |
          mkdir out && cp android/app/build/outputs/apk/release/app-release.apk out/VeraoNoAzul.apk
          cd out && git init -q && git checkout -q -b apk && git add . \
            && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "APK build ${{ github.run_number }}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
      - uses: actions/upload-artifact@v4
        with: { name: VeraoNoAzul-apk, path: out/VeraoNoAzul.apk }
