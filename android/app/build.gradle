plugins { id 'com.android.application' }

android {
    namespace 'com.briniouz.veraonoazul'
    compileSdk 34

    defaultConfig {
        applicationId 'com.briniouz.veraonoazul'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VCODE') ?: '1') as int)
        versionName "1.${System.getenv('VCODE') ?: '0'}"
    }

    // Chave fixa: assim cada APK novo instala por cima do anterior sem perder os dados.
    signingConfigs {
        fixo {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.fixo }
        debug { signingConfig signingConfigs.fixo }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
